[package]
name = "orca-agent-cli"
version = "0.1.0"
edition = "2021"
authors = ["Orca Agent CLI Contributors"]
description = "Orca Agent CLI — AI coding orchestration tool"
license = "MIT"
repository = "https://github.com/your-org/orca-agent-cli"
rust-version = "1.75"

[[bin]]
name = "orca"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "cargo", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
walkdir = "2"
ignore = "0.4"
directories = "5"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = "0.8"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = "1"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
strip = true
